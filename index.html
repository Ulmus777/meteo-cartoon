<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Tema azzurro cielo per la barra di stato -->
    <meta name="theme-color" content="#5EC8F2">
    <title>Meteo Mobile Cartoon</title>
    
    <!-- META TAGS PER APP STANDALONE (PWA) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- ICONE SVG CARTOON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%235EC8F2'/><circle cx='50' cy='50' r='20' fill='%23FFD13B' stroke='%231A1A1A' stroke-width='4'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%235EC8F2'/><circle cx='50' cy='50' r='20' fill='%23FFD13B' stroke='%231A1A1A' stroke-width='4'/></svg>">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Font Google: Fredoka (Stile tondeggiante e cartoon) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette Cartoon */
            --bg-color: #5EC8F2;       /* Azzurro cielo */
            --card-bg: #FFFFFF;        /* Sfondo card bianco */
            --card-border: #1A1A1A;    /* Bordo spesso scuro (stile fumetto) */
            --text-main: #1A1A1A;      /* Testo scuro */
            --text-muted: #666666;     /* Testo secondario */
            
            --accent-red: #FF5A5F;     /* Rosso vivace */
            --accent-yellow: #FFD13B;  /* Giallo sole */
            --accent-blue: #3BA9FF;    /* Blu pioggia */
            --accent-green: #00D084;   /* Verde menta */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            color: var(--text-main);
            font-family: 'Fredoka', sans-serif;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)) 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            position: relative;
        }

        .cartoon-font {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            flex-shrink: 0;
            z-index: 100;
        }

        .top-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #1A1A1A;
            padding: 0 4px;
            min-height: 24px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            background: #FFF;
            padding: 4px 12px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            box-shadow: 2px 2px 0px var(--card-border);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border: 2px solid var(--card-border);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .fullscreen-btn {
            background: #FFF;
            border: 2px solid var(--card-border);
            box-shadow: 2px 2px 0px var(--card-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            width: 100%;
        }

        .search-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #searchBar {
            flex-grow: 1;
            height: 56px;
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            box-shadow: 4px 4px 0px var(--card-border);
            border-radius: 28px;
            color: var(--text-main);
            padding: 0 24px;
            font-size: 24px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        
        #searchBar::placeholder { color: #A0A0A0; font-weight: 500; }
        #searchBar:focus { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--card-border); }

        .fav-toggle-btn {
            width: 56px;
            height: 56px;
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            box-shadow: 4px 4px 0px var(--card-border);
            border-radius: 28px;
            color: #E0E0E0; /* Stella spenta */
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.1s;
        }

        .fav-toggle-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--card-border);
        }

        .favorites-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .favorites-list::-webkit-scrollbar { display: none; }

        .fav-pill {
            background: #FFF;
            border: 2px solid var(--card-border);
            box-shadow: 3px 3px 0px var(--card-border);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .fav-pill:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--card-border);
            background: var(--accent-yellow);
        }

        #suggestions {
            position: absolute;
            top: 62px;
            left: 0;
            right: 0;
            background: #FFF;
            border: 3px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--card-border);
            max-height: 180px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 2px solid #E0E0E0;
            cursor: pointer;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:active { background: var(--accent-yellow); }

        .card:not(.map-card) {
            background: var(--card-bg);
            border: 4px solid var(--card-border);
            box-shadow: 6px 6px 0px var(--card-border);
            border-radius: 24px;
            padding: 18px 22px;
            flex: 0.95;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .current-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-left { display: flex; flex-direction: column; justify-content: center; }

        .temp-huge {
            font-size: 78px;
            line-height: 0.9;
            margin: 0 0 4px 0;
            text-shadow: 4px 4px 0px var(--accent-yellow);
        }

        .current-sub-info { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .val-highlight { color: var(--text-main); font-weight: 700; }

        .main-dot-icon-large {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .main-dot-icon-large svg { width: 100%; height: 100%; filter: drop-shadow(4px 4px 0px #1A1A1A); }

        .current-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 3px dashed #E0E0E0;
            font-size: 14px;
        }

        .weather-state-title {
            background: var(--accent-yellow);
            padding: 6px 14px;
            border-radius: 14px;
            border: 2px solid var(--card-border);
            font-weight: 700;
        }

        .temp-range { font-weight: 700; font-size: 15px; }
        .temp-range span.blue { color: var(--accent-blue); }
        .temp-range span.red { color: var(--accent-red); }

        .hourly-wrapper {
            flex: 0.85;
            min-height: 0;
            display: flex;
            align-items: center;
        }

        .hourly-container {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 4px 4px 8px 4px; /* Padding extra per l'ombra */
            scrollbar-width: none;
            width: 100%;
            height: 100%;
        }
        .hourly-container::-webkit-scrollbar { display: none; }

        .hour-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            box-shadow: 4px 4px 0px var(--card-border);
            border-radius: 20px;
            padding: 12px 8px;
            min-width: 90px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            text-align: center;
        }

        .hour-time { font-size: 13px; color: var(--text-main); font-weight: 700; background: #F0F0F0; border-radius: 8px; padding: 2px 8px; }

        .hour-dot-icon-large { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; }
        .hour-dot-icon-large svg { width: 100%; height: 100%; }

        .hour-temps-row { display: flex; gap: 6px; align-items: baseline; }
        .temp-real { font-size: 18px; color: var(--text-main); font-weight: 700; }
        .temp-feels { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        .precip-tag-always {
            font-size: 12px;
            color: var(--accent-blue);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .map-card {
            background: var(--card-bg);
            border: 4px solid var(--card-border);
            box-shadow: 6px 6px 0px var(--card-border);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1.5;
            min-height: 0;
            justify-content: space-between;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            min-height: 140px;
            border: 3px solid var(--card-border);
            border-radius: 16px;
            background: #A9D6E5; /* Colore mare cartoon di base */
        }

        .radar-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
            flex-shrink: 0;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent-red);
            border: 3px solid var(--card-border);
            box-shadow: 3px 3px 0px var(--card-border);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
        }
        .play-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--card-border); }
        .play-btn svg { width: 18px; height: 18px; fill: currentColor; }

        #timeSlider {
            flex-grow: 1;
            accent-color: var(--accent-blue);
            height: 10px;
            border-radius: 5px;
            outline: none;
            background: #E0E0E0;
            border: 2px solid var(--card-border);
            -webkit-appearance: none;
        }
        #timeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-yellow);
            border: 3px solid var(--card-border);
            border-radius: 50%;
            cursor: pointer;
        }

        .radar-time { font-size: 14px; min-width: 48px; text-align: right; font-weight: 700; }

        .gps-marker-ring {
            width: 20px;
            height: 20px;
            background: var(--accent-red);
            border: 4px solid var(--card-border);
            border-radius: 50%;
            box-shadow: 2px 2px 0px var(--card-border);
        }

        footer.credits {
            font-size: 11px;
            color: #1A1A1A;
            font-weight: 600;
            text-align: center;
            padding: 0;
            opacity: 0.8;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div id="app-container">

    <header>
        <div class="top-status">
            <div class="status-badge" onclick="requestLocation(true)" title="Tocca per riprovare GPS">
                <span class="status-dot"></span>
                <span id="updateIndicator">RICERCA GPS...</span>
            </div>
            <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Schermo Intero">
                <svg id="fullscreenIcon" viewBox="0 0 24 24" width="14" height="14" fill="#1A1A1A"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <span id="fullscreenText">ESPANDI</span>
            </button>
        </div>

        <div class="search-container">
            <div class="search-row">
                <form id="searchForm" action="javascript:void(0);" style="flex-grow:1;">
                    <input type="search" id="searchBar" name="weather_search_no_autofill" placeholder="Cerca città..." autocomplete="do-not-autofill" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" />
                </form>
                <button class="fav-toggle-btn" id="favBtn" onclick="toggleCurrentFavorite()" title="Aggiungi ai preferiti">★</button>
            </div>
            <div id="suggestions"></div>
            <div class="favorites-list" id="favoritesList"></div>
        </div>
    </header>

    <!-- METEO ATTUALE -->
    <div class="card">
        <div class="current-main">
            <div class="current-left">
                <div class="temp-huge cartoon-font" id="mainTemp">--°</div>
                <div class="current-sub-info">
                    Percepita: <span class="val-highlight" id="feelsLike">--°</span> &nbsp;|&nbsp;
                    Umidità: <span class="val-highlight" id="humidity">--%</span>
                </div>
            </div>
            <div class="main-dot-icon-large" id="mainIcon"></div>
        </div>
        <div class="current-bottom-bar">
            <div class="weather-state-title" id="weatherDesc">Caricamento...</div>
            <div class="temp-range">
                <span class="blue">↓ <span id="minTemp">--°</span></span>
                <span class="red">↑ <span id="maxTemp">--°</span></span>
            </div>
            <div id="moonPhaseBox" style="display:none; color: var(--text-muted); font-size: 12px; font-weight:600;">
                Fase: <span class="val-highlight" id="moonPhaseText">--</span>
            </div>
        </div>
    </div>

    <!-- PREVISIONI ORARIE -->
    <div class="hourly-wrapper">
        <div class="hourly-container" id="hourlyForecast">
            <!-- Popolato via JS -->
        </div>
    </div>

    <!-- MAPPA RADAR -->
    <div class="card map-card">
        <div id="map"></div>
        <div class="radar-controls">
            <button class="play-btn" id="playBtn" aria-label="Play/Pausa">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <input type="range" id="timeSlider" min="0" max="10" step="1" value="10">
            <span id="radarTime" class="radar-time">--:--</span>
        </div>
    </div>

    <footer class="credits">sviluppato da un'idea di Marco</footer>

</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        /* === NUOVE ICONE VETTORIALI CARTOON === */
        const svgBase = 'viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"';
        const thickStroke = 'stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"';
        
        // Forme Base Riutilizzabili
        const cloudShapes = '<circle cx="50" cy="40" r="18"/><circle cx="35" cy="52" r="14"/><circle cx="65" cy="52" r="14"/><rect x="35" y="38" width="30" height="28" rx="0"/>';
        const cloudSVG = `<g ${thickStroke}>${cloudShapes}</g><g fill="#FFFFFF">${cloudShapes}</g>`;
        
        const sunOutline = `<circle cx="50" cy="50" r="18" fill="#FFD13B" ${thickStroke}/><path d="M50,15 L50,24 M50,76 L50,85 M15,50 L24,50 M76,50 L85,50 M25,25 L32,32 M68,68 L75,75 M25,75 L32,68 M68,25 L75,32" ${thickStroke}/>`;
        const moonOutline = `<path d="M55,15 A30,30 0 1,0 80,65 A25,25 0 1,1 55,15 Z" fill="#FFD13B" ${thickStroke}/>`;
        
        const rainDrops = `<path d="M40,70 L35,85 M60,70 L55,85" stroke="#3BA9FF" stroke-width="6" stroke-linecap="round"/>`;
        const heavyRainDrops = `<path d="M35,68 L30,83 M50,72 L45,87 M65,68 L60,83" stroke="#3BA9FF" stroke-width="6" stroke-linecap="round"/>`;
        const lightning = `<path d="M45,70 L55,70 L45,85 L60,85 L50,100 L55,85 L40,85 Z" fill="#FFD13B" ${thickStroke} transform="translate(0,-10)"/>`;
        const snowflakes = `<circle cx="40" cy="78" r="4" fill="#3BA9FF"/><circle cx="60" cy="82" r="4" fill="#3BA9FF"/><circle cx="50" cy="90" r="4" fill="#3BA9FF"/>`;
        
        const standardIcons = {
            sun: `<svg ${svgBase}>${sunOutline}</svg>`,
            sunPoco: `<svg ${svgBase}><g transform="translate(-10,-10)">${sunOutline}</g><g transform="translate(15, 20) scale(0.75)">${cloudSVG}</g></svg>`,
            sunCloud: `<svg ${svgBase}><g transform="translate(-15,-15) scale(0.9)">${sunOutline}</g><g transform="translate(5, 15) scale(0.9)">${cloudSVG}</g></svg>`,
            coperto: `<svg ${svgBase}><g transform="translate(-15, -5) scale(0.9)">${cloudSVG}</g><g transform="translate(10, 15) scale(0.95)">${cloudSVG}</g></svg>`,
            moon: `<svg ${svgBase}>${moonOutline}</svg>`,
            moonPoco: `<svg ${svgBase}><g transform="translate(-10,-10)">${moonOutline}</g><g transform="translate(15, 20) scale(0.75)">${cloudSVG}</g></svg>`,
            pioggiaDebole: `<svg ${svgBase}>${cloudSVG}${rainDrops}</svg>`,
            pioggiaForte: `<svg ${svgBase}>${cloudSVG}${heavyRainDrops}</svg>`,
            temporale: `<svg ${svgBase}>${cloudSVG}${lightning}</svg>`,
            neve: `<svg ${svgBase}>${cloudSVG}${snowflakes}</svg>`,
            grandine: `<svg ${svgBase}>${cloudSVG}<circle cx="40" cy="78" r="4" fill="#FFF" ${thickStroke}/><circle cx="60" cy="85" r="4" fill="#FFF" ${thickStroke}/></svg>`,
            nebbia: `<svg ${svgBase}><path d="M25,40 L75,40 M35,55 L65,55 M25,70 L75,70" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/><path d="M25,40 L75,40 M35,55 L65,55 M25,70 L75,70" stroke="#FFF" stroke-width="4" stroke-linecap="round"/></svg>`,
            fiamma: `<svg ${svgBase}><path d="M50,15 Q65,40 65,65 A15,15 0 1,1 35,65 Q35,40 50,15 Z" fill="#FF5A5F" ${thickStroke}/><path d="M50,40 Q55,50 55,65 A5,5 0 1,1 45,65 Q45,50 50,40 Z" fill="#FFD13B" stroke="#1A1A1A" stroke-width="3"/></svg>`,
            freddo: `<svg ${svgBase}><circle cx="50" cy="50" r="22" fill="#E0F7FA" ${thickStroke}/><path d="M50,22 L50,12 M50,78 L50,88 M22,50 L12,50 M78,50 L88,50 M30,30 L22,22 M70,70 L78,78 M30,70 L22,78 M70,30 L78,22" ${thickStroke}/></svg>`,
            ventoso: `<svg ${svgBase}><path d="M20,40 L60,40 Q70,40 70,30 Q70,20 60,20 Q50,20 50,30 M10,60 L70,60 Q85,60 85,75 Q85,90 70,90 Q55,90 55,75 M30,80 L50,80 Q60,80 60,85 Q60,95 50,95 Q40,95 40,85" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/><path d="M20,40 L60,40 Q70,40 70,30 Q70,20 60,20 Q50,20 50,30 M10,60 L70,60 Q85,60 85,75 Q85,90 70,90 Q55,90 55,75 M30,80 L50,80 Q60,80 60,85 Q60,95 50,95 Q40,95 40,85" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/></svg>`
        };

        const dropIconSvg = `<svg width="10" height="14" viewBox="0 0 12 18" fill="#3BA9FF"><path d="M6 18c-3.3 0-6-2.7-6-6 0-3.9 6-12 6-12s6 8.1 6 12c0 3.3-2.7 6-6 6z"/></svg>`;

        /* ARRAY DI EMERGENZA (USATO SOLO PER RICERCHE FALLITE) */
        const fallbackCities = [
            { name: "Roma", lat: 41.9028, lon: 12.4964 },
            { name: "Milano", lat: 45.4642, lon: 9.1900 },
            { name: "Pegognaga", lat: 46.1384, lon: 12.2163 }
        ];

        let map, radarLayer, cloudLayer, gpsMarker;
        let radarTimestamps = [];
        let satelliteTimestamps = [];
        let currentFrameIndex = 0;
        let animationTimer = null;
        let isPlaying = true;
        let searchTimeout = null;
        
        let currentCityName = "Pegognaga";
        let favorites = ["Pegognaga", "Bologna"];
        let isSelectingOption = false;

        let initialMapCenter = [46.1384, 12.2163];
        const INITIAL_ZOOM = 7;

        let watchId = null;

        function getNearestCity(lat, lon) {
            let minDist = Infinity;
            let nearest = "Pegognaga";
            fallbackCities.forEach(city => {
                const dist = Math.hypot(city.lat - lat, city.lon - lon);
                if (dist < minDist) {
                    minDist = dist;
                    nearest = city.name;
                }
            });
            return nearest;
        }

        function requestLocation(showSearchingState = true) {
            if (showSearchingState) {
                setUpdateState("RICERCA GPS...");
                clearUIData();
            }

            if (!navigator.geolocation) {
                fallbackLocation("GPS NON SUPPORTATO");
                return;
            }

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (gpsTimeoutTimer) clearTimeout(gpsTimeoutTimer);

            const options = {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            };

            gpsTimeoutTimer = setTimeout(() => {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                    fallbackLocation("GPS POCO PRECISO");
                }
            }, 15000);

            watchId = navigator.geolocation.watchPosition(
                pos => {
                    const { latitude: lat, longitude: lon, accuracy } = pos.coords;

                    if (accuracy <= 500) {
                        if (gpsTimeoutTimer) clearTimeout(gpsTimeoutTimer);
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                        
                        applyGpsLocation(lat, lon);
                    }
                },
                err => {
                    if (gpsTimeoutTimer) clearTimeout(gpsTimeoutTimer);
                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    console.warn("GPS Errore/Negato:", err);
                    let statusMsg = "GPS NON TROVATO";
                    if (err.code === err.PERMISSION_DENIED) {
                        statusMsg = "GPS NEGATO";
                    }
                    fallbackLocation(statusMsg);
                },
                options
            );
        }

        async function applyGpsLocation(lat, lon) {
            const cityName = await resolveCityName(lat, lon);
            
            currentCityName = cityName;
            localStorage.setItem('lastCityName', cityName);
            localStorage.setItem('lastLat', lat);
            localStorage.setItem('lastLon', lon);
            
            document.getElementById('searchBar').value = cityName;
            updateStarIcon();
            
            fetchWeatherData(lat, lon, "ONLINE");
        }

        async function resolveCityName(lat, lon) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=it`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.address) {
                        const name = data.address.city || data.address.town || data.address.village || data.address.municipality || data.address.suburb;
                        if (name) return name;
                    }
                }
            } catch (e) {
                console.warn("Reverse geocoding fallito:", e);
            }
            return getNearestCity(lat, lon);
        }

        function fallbackLocation(statusMsg = "GPS NON TROVATO") {
            const lastLat = parseFloat(localStorage.getItem('lastLat')) || 46.1384;
            const lastLon = parseFloat(localStorage.getItem('lastLon')) || 12.2163;
            const savedCity = localStorage.getItem('lastCityName') || "Pegognaga";
            
            currentCityName = savedCity;
            document.getElementById('searchBar').value = savedCity;
            updateStarIcon();

            fetchWeatherData(lastLat, lastLon, statusMsg);
        }

        async function fetchSuggestions(query) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=it`);
                const data = await res.json();
                const suggestionsBox = document.getElementById('suggestions');
                
                if (data.results && data.results.length > 0) {
                    suggestionsBox.innerHTML = '';
                    data.results.forEach(city => {

                        const adminStr = city.admin1 ? `, ${city.admin1}` : '';
                        div.innerText = `${city.name}${adminStr} (${city.country_code || ''})`;
                        div.onmousedown = () => { isSelectingOption = true; };
                        div.onclick = () => {
                            isSelectingOption = false;
                            currentCityName = city.name;
                            localStorage.setItem('lastCityName', city.name);
                            localStorage.setItem('lastLat', city.latitude);
                            localStorage.setItem('lastLon', city.longitude);
                            document.getElementById('searchBar').value = city.name;
                            suggestionsBox.style.display = 'none';
                            updateStarIcon();
                            fetchWeatherData(city.latitude, city.longitude, "ONLINE");

                    suggestionsBox.style.display = 'block';

                    suggestionsBox.style.display = 'none';
                }
            } catch (e) { console.error(e); }
        }

        function getMoonPhase(date = new Date()) {
            let year = date.getFullYear();
            let month = date.getMonth() + 1;
            let day = date.getDate();
            if (month < 3) { year--; month += 12; }
            month++;
            let c = 365.25 * year;
            let e = 30.6 * month;
            let jd = c + e + day - 694039.09;
            jd /= 29.5305882;
            let phase = jd - Math.floor(jd);

            if (phase < 0.06 || phase >= 0.94) return "Luna nuova";
            if (phase < 0.24) return "Crescente";
            if (phase < 0.26) return "Primo quarto";
            if (phase < 0.49) return "Gibb. crescente";
            if (phase < 0.51) return "Luna piena";
            if (phase < 0.74) return "Gibb. calante";
            if (phase < 0.76) return "Ultimo quarto";
            return "Calante";
        }

        async function fetchWeatherData(lat, lon, statusText = "ONLINE") {
            const startTime = Date.now();
            setUpdateState("AGGIORNAMENTO...");
            try {
                const openMeteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&models=best_match&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,precipitation_probability,wind_speed_10m&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,is_day,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
                const openMeteoRes = await fetch(openMeteoUrl);
                const openMeteoData = await openMeteoRes.json();
                
                if (!openMeteoData || openMeteoData.error) throw new Error("Risposta API Open-Meteo invalida");

                localStorage.setItem('weatherData', JSON.stringify(openMeteoData));
                
                const elapsed = Date.now() - startTime;
                if (elapsed < 500) {
                    await new Promise(r => setTimeout(r, 500 - elapsed));
                }

                renderWeather(openMeteoData);
                updateMapCenter(lat, lon);
                fetchRadarData();
                setUpdateState(statusText);
            } catch (e) {
                console.error("Errore fetch meteo:", e);
                setUpdateState(statusText);
            }
        }

        function renderWeather(data) {
            const current = data.current;
            if (!current) return;

            const isDay = current.is_day === 1;

            document.getElementById('mainTemp').innerText = Math.round(current.temperature_2m) + '°';
            document.getElementById('feelsLike').innerText = Math.round(current.apparent_temperature) + '°';
            document.getElementById('humidity').innerText = (current.relative_humidity_2m || 0) + '%';

            if (data.daily && data.daily.temperature_2m_min) {
                document.getElementById('minTemp').innerText = Math.round(data.daily.temperature_2m_min[0]) + '°';
                document.getElementById('maxTemp').innerText = Math.round(data.daily.temperature_2m_max[0]) + '°';
            }
            
            const weatherInfo = wmoCodes[current.weather_code] || { desc: 'Variabile', day: 'sun', night: 'moon' };
            let iconKey = isDay ? weatherInfo.day : weatherInfo.night;

            const currentPrecip = current.precipitation_probability || 0;
            const currentTempFelt = current.apparent_temperature !== undefined ? current.apparent_temperature : current.temperature_2m;
            const currentWind = current.wind_speed_10m || 0;

            if (currentPrecip >= 50 && !['temporale', 'neve', 'grandine'].includes(iconKey)) {
                iconKey = 'pioggiaForte';
            } else if (currentPrecip >= 35 && !['temporale', 'neve', 'grandine'].includes(iconKey)) {
                iconKey = 'pioggiaDebole';
            } else if (currentPrecip < 35 && ['pioggiaDebole', 'pioggiaForte'].includes(iconKey)) {
                iconKey = current.weather_code === 3 ? 'coperto' : (isDay ? 'sunCloud' : 'moonPoco');
            }

            const hasPrecipitation = ['temporale', 'neve', 'grandine', 'pioggiaForte', 'pioggiaDebole'].includes(iconKey);
            if (!hasPrecipitation) {
                if (currentTempFelt >= 37) { iconKey = 'fiamma'; }
                else if (currentTempFelt <= -2) { iconKey = 'freddo'; }
                else if (currentWind >= 45) { iconKey = 'ventoso'; }
            }

            document.getElementById('weatherDesc').innerText = weatherInfo.desc;
            document.getElementById('mainIcon').innerHTML = standardIcons[iconKey] || standardIcons['sun'];

            const moonBox = document.getElementById('moonPhaseBox');
            if (!isDay) {
                moonBox.style.display = 'block';
                document.getElementById('moonPhaseText').innerText = getMoonPhase();
            } else {
                moonBox.style.display = 'none';
            }

            const container = document.getElementById('hourlyForecast');
            container.innerHTML = '';

            let startIdx = 0;
            if (data.hourly && data.hourly.time && data.hourly.time.length > 0) {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const hh = String(now.getHours()).padStart(2, '0');
                const targetIsoStr = `${yyyy}-${mm}-${dd}T${hh}:00`;

                const foundIndex = data.hourly.time.findIndex(t => t >= targetIsoStr);
                if (foundIndex !== -1) {
                    startIdx = foundIndex + 1;
                }
            }

            const limit = Math.min(startIdx + 12, data.hourly.time.length);
            for (let i = startIdx; i < limit; i++) {
                const dateStr = data.hourly.time[i];
                const hourNum = parseInt(dateStr.split('T')[1].split(':')[0], 10);
                const hourFormatted = hourNum.toString().padStart(2, '0') + ':00';
                
                const tempReal = Math.round(data.hourly.temperature_2m[i]);
                const tempFeels = Math.round(data.hourly.apparent_temperature[i]);
                const precip = data.hourly.precipitation_probability[i] !== undefined ? data.hourly.precipitation_probability[i] : 0;
                const windHour = (data.hourly.wind_speed_10m && data.hourly.wind_speed_10m[i] !== undefined) ? data.hourly.wind_speed_10m[i] : 0;
                const code = data.hourly.weather_code[i];
                const hourIsDay = data.hourly.is_day[i] === 1;

                const hInfo = wmoCodes[code] || { day: 'sun', night: 'moon' };
                let hIconKey = hourIsDay ? hInfo.day : hInfo.night;

                if (precip >= 50 && !['temporale', 'neve', 'grandine'].includes(hIconKey)) {
                    hIconKey = 'pioggiaForte';
                } else if (precip >= 35 && !['temporale', 'neve', 'grandine'].includes(hIconKey)) {
                    hIconKey = 'pioggiaDebole';
                } else if (precip < 35 && ['pioggiaDebole', 'pioggiaForte'].includes(hIconKey)) {
                    hIconKey = code === 3 ? 'coperto' : (hourIsDay ? 'sunCloud' : 'moonPoco');
                }

                const hHasPrecipitation = ['temporale', 'neve', 'grandine', 'pioggiaForte', 'pioggiaDebole'].includes(hIconKey);

                if (!hHasPrecipitation) {
                    if (tempFeels >= 37) { hIconKey = 'fiamma'; }
                    else if (tempFeels <= -2) { hIconKey = 'freddo'; }
                    else if (windHour >= 45) { hIconKey = 'ventoso'; }
                }

                const card = document.createElement('div');
                card.className = 'hour-card';
                card.innerHTML = `
                    <div class="hour-time">${hourFormatted}</div>
                    <div class="hour-dot-icon-large">${standardIcons[hIconKey] || standardIcons['sun']}</div>
                    <div class="hour-temps-row">
                        <span class="temp-real">${tempReal}°</span>
                        <span class="temp-feels">${tempFeels}°</span>
                    </div>
                    <div class="precip-tag-always">${dropIconSvg} ${precip}%</div>
                `;
                container.appendChild(card);
            }
        }

        function initMap() {
            if (map) return;
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                maxZoom: 14,
                minZoom: 2
            }).setView(initialMapCenter, INITIAL_ZOOM);

            // Mappa chiara e colorata stile cartoon (CartoDB Voyager)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
                maxZoom: 14,
                minZoom: 2,
                zIndex: 1
            }).addTo(map);

            const redDotIcon = L.divIcon({
                className: 'gps-marker-ring',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            gpsMarker = L.marker(initialMapCenter, { icon: redDotIcon, zIndexOffset: 1000 }).addTo(map);

            setTimeout(() => { if (map) map.invalidateSize(); }, 300);
        }

        function updateMapCenter(lat, lon) {
            initialMapCenter = [lat, lon];
            if (map) {
                map.setView(initialMapCenter, map.getZoom() || INITIAL_ZOOM);

                if (gpsMarker) map.removeLayer(gpsMarker);
                const redDotIcon = L.divIcon({
                    className: 'gps-marker-ring',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                gpsMarker = L.marker([lat, lon], { icon: redDotIcon, zIndexOffset: 1000 }).addTo(map);

                setTimeout(() => { map.invalidateSize(); }, 100);
            }
        }

        async function fetchRadarData() {
            try {
                const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                const data = await res.json();
                radarTimestamps = data.radar ? data.radar.past : [];
                satelliteTimestamps = (data.satellite && data.satellite.infrared) ? data.satellite.infrared : [];

                const slider = document.getElementById('timeSlider');
                slider.max = Math.max(0, radarTimestamps.length - 1);
                
                currentFrameIndex = 0;

                if (map) map.invalidateSize();
                startAnimation();
            } catch (e) { console.error("Errore Radar", e); }
        }

        function setRadarFrame(index) {
            if (!radarTimestamps || !radarTimestamps[index] || !map) return;
            currentFrameIndex = index;
            document.getElementById('timeSlider').value = index;

            const frame = radarTimestamps[index];
            
            if (radarLayer) map.removeLayer(radarLayer);
            if (cloudLayer) map.removeLayer(cloudLayer);

            if (satelliteTimestamps.length > 0) {
                const satFrame = satelliteTimestamps[Math.min(index, satelliteTimestamps.length - 1)];
                cloudLayer = L.tileLayer(`https://tilecache.rainviewer.com${satFrame.path}/256/{z}/{x}/{y}/0/0_0.png`, {
                    opacity: 0.4,
                    maxNativeZoom: 7,
                    maxZoom: 14,
                    minZoom: 2,
                    zIndex: 5
                }).addTo(map);
            }

            radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                opacity: 0.8,
                maxNativeZoom: 7,
                maxZoom: 14,
                minZoom: 2,
                zIndex: 10
            }).addTo(map);

            const date = new Date(frame.time * 1000);
            document.getElementById('radarTime').innerText = date.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
        }

        function playNextFrame() {
            if (!isPlaying || radarTimestamps.length === 0) return;

            setRadarFrame(currentFrameIndex);
            const isLastFrame = (currentFrameIndex === radarTimestamps.length - 1);
            const delay = isLastFrame ? 2500 : 700;

            currentFrameIndex++;
            if (currentFrameIndex >= radarTimestamps.length) {
                currentFrameIndex = 0;
            }

            animationTimer = setTimeout(playNextFrame, delay);
        }

        function startAnimation() {
            stopAnimation();
            isPlaying = true;
            updatePlayIcon();
            playNextFrame();
        }

        function stopAnimation() {
            isPlaying = false;
            updatePlayIcon();
            if (animationTimer) clearTimeout(animationTimer);
        }

        function toggleAnimation() {
            if (isPlaying) {
                stopAnimation();
            } else {
                if (map) map.setView(initialMapCenter, INITIAL_ZOOM);
                startAnimation();
            }
        }

        function updatePlayIcon() {
            const icon = document.getElementById('playIcon');
            icon.innerHTML = isPlaying
                ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
                : '<path d="M8 5v14l11-7z"/>';
        }

        async function searchCity(query) {
            if (!query) return;
            setUpdateState("RICERCA...");
            clearUIData();
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=it`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const { latitude, longitude, name } = data.results[0];
                    currentCityName = name;
                    localStorage.setItem('lastCityName', name);
                    localStorage.setItem('lastLat', latitude);
                    localStorage.setItem('lastLon', longitude);
                    document.getElementById('searchBar').value = name;
                    updateStarIcon();
                    fetchWeatherData(latitude, longitude, "ONLINE");
                } else {
                    setUpdateState("NON TROVATA");
                }
            } catch (e) { console.error(e); }
        }

        function setUpdateState(msg) {
            document.getElementById('updateIndicator').innerText = msg;
        }
    </script>
</body>
</html>
